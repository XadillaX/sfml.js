name: Publish Docs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-docs
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libflac-dev libvorbis-dev libopenal-dev libmbedtls-dev
      - run: node common/scripts/install-run-rush.js install
      - run: node common/scripts/install-run-rush.js build --to sfml-js-site
      - run: npm --prefix site test
      - name: Publish to gh-pages
        run: |
          cp -R site/build/site "$RUNNER_TEMP/sfml-site"
          git fetch --depth=1 origin gh-pages
          git checkout --detach FETCH_HEAD
          if [ -f docs/CNAME ]; then
            cp docs/CNAME "$RUNNER_TEMP/sfml-site/CNAME"
          fi
          touch "$RUNNER_TEMP/sfml-site/.nojekyll"
          rm -rf docs
          cp -R "$RUNNER_TEMP/sfml-site" docs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: update'
          git push origin HEAD:gh-pages
