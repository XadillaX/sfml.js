name: Node.js CI <Linux>

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install graphics and audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xvfb xauth libgl1-mesa-dev libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libflac-dev libvorbis-dev libopenal-dev
    - run: npm ci
    - run: npm run lint
    - run: npm run test:types
    - run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:runtime
    - run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:ported
