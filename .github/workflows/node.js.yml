name: Node.js CI <Linux>

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      LIBGL_ALWAYS_SOFTWARE: "1"
      NODE_OPTIONS: --max_old_space_size=4096
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install graphics and audio dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential xvfb xauth libgl1-mesa-dev libgl1-mesa-dri libglx-mesa0 libegl-mesa0 libgbm1 libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libfreetype-dev libflac-dev libvorbis-dev libopenal-dev libmbedtls-dev
    - run: node common/scripts/install-run-rush.js install
    - run: node common/scripts/install-run-rush.js build
    - run: npm --prefix packages/sfml.js-interop run cpplint
    - run: npm --prefix packages/sfml.js run cpplint
    - run: npm --prefix packages/sfml.js run lint
    - run: npm --prefix packages/sfml.js run test:types
    # Keep the display alive between the suite's isolated Node.js processes.
    - run: xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" npm --prefix packages/sfml.js run test:runtime
    - run: npm --prefix packages/sfml.js-imgui run lint
    - run: npm --prefix packages/sfml.js-imgui run cpplint
    - run: npm --prefix packages/sfml.js-imgui run test:types
    # npm --prefix runs scripts from the package directory, so --require is relative to it.
    - run: env NODE_OPTIONS="$NODE_OPTIONS --require ./tools/disable-imgui-cursor.cjs" xvfb-run -a -s "-screen 0 1280x1024x24 +extension GLX +render -noreset" npm --prefix packages/sfml.js-imgui run test:runtime
