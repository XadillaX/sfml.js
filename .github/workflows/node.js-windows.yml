name: Node.js CI <Windows>

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    env:
      GALLIUM_DRIVER: llvmpipe
      NODE_OPTIONS: --max_old_space_size=4096
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - uses: microsoft/setup-msbuild@v2
    - name: Install software OpenGL
      uses: ssciwr/setup-mesa-dist-win@v3
      with:
        version: "26.0.3"
    - run: node common/scripts/install-run-rush.js install
    - run: node common/scripts/install-run-rush.js build
    - run: npm --prefix packages/sfml.js run lint
    - run: npm --prefix packages/sfml.js run test:types
    - run: npm --prefix packages/sfml.js run test:runtime
    - run: npm --prefix packages/sfml.js-imgui run lint
    - run: npm --prefix packages/sfml.js-imgui run test:types
    - run: npm --prefix packages/sfml.js-imgui run test:runtime
